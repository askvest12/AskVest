name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore locked
        run: dotnet restore AskVest.slnx --locked-mode
      - name: Build
        run: dotnet build AskVest.slnx -c Release --no-restore
      - name: Test
        run: dotnet test AskVest.slnx -c Release --no-build
      - name: Audit packages
        run: dotnet list AskVest.slnx package --vulnerable --include-transitive
