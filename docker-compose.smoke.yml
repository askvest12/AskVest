name: askvest-smoke

services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${ASKVEST_ADMIN_PASSWORD:?required}

  migrator:
    build:
      context: .
      dockerfile: docker/migrator/Dockerfile
      args:
        INCLUDE_SAMPLE_DATA: "true"
    environment:
      ConnectionStrings__Platform: Host=postgres;Port=5432;Database=askvest;Username=askvest_owner;Password=${ASKVEST_OWNER_PASSWORD}
      DOTNET_ENVIRONMENT: Test
      Catalog__LoadSampleData: "true"
      Compliance__RealMoneyEnabled: "true"
      Compliance__RealMoneyCountries__0: US
      Compliance__RealMoneyCountries__1: GB
      Compliance__RealMoneyCountries__2: NG
      Compliance__RealMoneyCountries__3: KE

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      args:
        INCLUDE_SAMPLE_CONTENT: "true"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Platform: Host=postgres;Port=5432;Database=askvest;Username=askvest_app;Password=${ASKVEST_APP_PASSWORD}
      Docs__Enabled: "true"
      Diagnostics__EnableProbes: "true"
      RateLimiting__Global__PermitLimit: "10000"
      RateLimiting__Strict__PermitLimit: "30"
      RateLimiting__Strict__WindowSeconds: "10"
      Identity__LoginFailuresPerClientIp: "100000"
      Messaging__Smtp__Host: mailpit
      Messaging__Smtp__Port: "1025"
      Messaging__Smtp__FromAddress: noreply@askvest.local
      Messaging__Smtp__FromName: AskVest
      Messaging__Smtp__EnableStartTls: "false"
      Messaging__Sms__Mode: Development
      Messaging__Sms__ForwardTo: sms@askvest.local
      Compliance__RealMoneyEnabled: "true"
      Compliance__Kyc__Provider: "fake"
      Compliance__Screening__Provider: "fake"
      Compliance__Screening__HitNameMarker: "SMOKE-SANCTIONED"
      MarketData__Enabled: "true"
      MarketData__Provider: "fake"
      MarketData__Fake__Session: "regular"
      MarketData__LiveThresholdSeconds: "5"
      MarketData__StaleThresholdSeconds: "15"
      MarketData__PollIntervalSeconds: "5"
      MarketData__SymbolOverrides__sample-nvda: "SMOKE-UNKNOWN:NMS"
      Practice__FeeBasisPoints: "50"
      Practice__StopEvaluationIntervalSeconds: "2"
      Practice__ResetCooldownHours: "0.001"
      Learning__LoadSampleContent: "true"
      Learning__SampleContentPath: "data/learning-sample"
      Assistant__Enabled: "true"
      Assistant__Provider: "fake"
      Assistant__MessagesPerHour: "10"
      Assistant__MessagesPerDay: "50"
      Assistant__MessageTimeBudgetSeconds: "10"
      Trading__ProgressIntervalSeconds: "1"
      Trading__Fake__FillDelaySeconds: "1"
      Trading__Fake__SubmitDelaySeconds: "1"
      Trading__Fake__SpreadPercent: "0.5"
      Trading__SubmissionStuckSeconds: "10"
      Trading__SubmittedTimeoutSeconds: "60"
      Trading__Gateway__Routes__sample-gateway-evm-a__Provider: "fake"
      Trading__Gateway__Routes__sample-gateway-evm-a__SettlementAsset: "USD"
      Trading__Gateway__Routes__sample-gateway-evm-b__Provider: "fake"
      Trading__Gateway__Routes__sample-gateway-evm-b__SettlementAsset: "USD"
      Wallets__AddressCoolingOffHours: "0"
      Wallets__DepositIntervalSeconds: "2"
      Wallets__ProgressIntervalSeconds: "2"
      Wallets__SubmissionStuckSeconds: "10"
      Wallets__SubmittedTimeoutSeconds: "60"
      Wallets__ProviderTimeoutSeconds: "5"
      Wallets__ReservesIntervalMinutes: "1"
      Wallets__Custody__Fake__CompletionDelaySeconds: "2"
      Wallets__Custody__Fake__PendingFinalitySeconds: "1"
      Wallets__Custody__Routes__0__ChainId: "eip155:11155111"
      Wallets__Custody__Routes__0__Provider: "fake"
      Wallets__Custody__Routes__1__ChainId: "eip155:17000"
      Wallets__Custody__Routes__1__Provider: "fake"
      Wallets__Screening__Provider: "fake"
    ports: !override
      - "127.0.0.1:${ASKVEST_SMOKE_API_PORT:-5081}:8080"

  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1:${ASKVEST_MAILPIT_SMTP_PORT:-11025}:1025"
      - "127.0.0.1:${ASKVEST_MAILPIT_UI_PORT:-18025}:8025"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
